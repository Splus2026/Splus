[Settings]
default_separator = N500
debug_log_enabled = 1
last_db = C:/data/books.db
highlight_context_size = 300
max_display_chars = 40000
search_delay_ms = 250
excel_split_view_enabled = 1
excel_split_page_size = 30
vector_model_type = fasttext
vector_model_topn = 25
vector_models_dir = my_models
vector_sentences_before = 5
vector_sentences_after = 8
merge_source_dir = D:/Книги
merge_output_dir = D:/Склейка
password_hash = abc123
password_salt = def456
key_concepts_only = 1
enable_numerator_on_update = true

[Engine]
type = manticore

[Bases]
Библия.txt = Библия, N1000
